[project]
name = "kanbu-lunch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.55",
    "pydantic>=2.11",
]

[dependency-groups]
dev = ["pytest>=8.3", "PyYAML>=6.0", "types-PyYAML>=6.0", "ruff>=0.11", "basedpyright>=1.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.basedpyright]
include = ["instagram_slack_notifier.py", "instagram_client.py", "instagram_public.py", "instagram_browser.py", "instagram_apify.py", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
