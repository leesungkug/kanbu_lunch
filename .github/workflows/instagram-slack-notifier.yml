name: Instagram Slack Notifier

on:
  schedule:
    # Fallback schedule in case cron-job.org is not configured or misses a day.
    - cron: "38,46,54 10 * * *"
      timezone: "Asia/Seoul"
  repository_dispatch:
    types:
      - instagram-slack-notifier
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect the latest Instagram post without sending Slack or saving state
        required: false
        type: boolean
        default: true
      force_notify:
        description: Send the current latest Instagram post to Slack as a manual test
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-slack-notifier-main
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: main
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install runtime dependencies
        run: uv sync --locked --no-dev

      - name: Install Chromium
        if: vars.INSTAGRAM_SOURCE != 'apify'
        run: uv run --no-dev playwright install --with-deps chromium

      - name: Create runtime config
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          INSTAGRAM_SOURCE: ${{ vars.INSTAGRAM_SOURCE || 'browser' }}
        run: |
          umask 077
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "instagram_source": os.environ.get("INSTAGRAM_SOURCE", "browser"),
              "instagram_username": "lunch11_14",
              "instagram_profile_url": "https://www.instagram.com/lunch11_14/",
              "slack_webhook_url": os.environ["SLACK_WEBHOOK_URL"],
              "state_file": str(Path(os.environ["GITHUB_WORKSPACE"]) / ".instagram_state.json"),
              "notify_on_first_run": False,
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "config.json"
          path.write_text(json.dumps(config), encoding="utf-8")
          PY

      - name: Run notifier
        shell: bash
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_NOTIFY: ${{ inputs.force_notify }}
        run: |
          args=(--config "$RUNNER_TEMP/config.json")

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              args+=(--dry-run)
            elif [ "$FORCE_NOTIFY" = "true" ]; then
              args+=(--force-notify)
            fi
          fi

          uv run --locked --no-dev python instagram_slack_notifier.py "${args[@]}"

      - name: Commit updated state
        shell: bash
        run: |
          if [ -z "$(git status --short -- .instagram_state.json)" ]; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          state_base=$(git rev-parse HEAD)
          git add .instagram_state.json
          git commit -m "Update Instagram notifier state"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::State push failed after three attempts; check delivery before rerunning."
              exit 1
            fi
            git fetch origin "$TARGET_BRANCH"
            remote_head=$(git rev-parse FETCH_HEAD)
            if ! git merge-base --is-ancestor "$state_base" "$remote_head" ||
               ! git diff --quiet "$state_base" "$remote_head" -- .instagram_state.json; then
              echo "::error::Remote state or history changed; refusing to overwrite it. Check delivery before rerunning."
              exit 1
            fi
            if ! git rebase "$remote_head"; then
              git rebase --abort
              echo "::error::Could not rebase notifier state. Check delivery before rerunning."
              exit 1
            fi
          done
